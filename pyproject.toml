[project]
name = "cliuno-fastapi-template"
version = "1.0.0"
description = "CLIuno FastAPI Template - A production-ready FastAPI REST API template"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "sqlalchemy>=2.1.4",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.0",
    "pydantic-settings>=2.15.0",
    "alembic>=1.20.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
